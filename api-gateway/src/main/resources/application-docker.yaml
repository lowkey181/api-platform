spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: public
        group: DEFAULT_GROUP
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:mysql://mysql:3306/api_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: redis
      port: 6379
api:
  gateway:
    auth:
      base-url: http://api-admin  # 使用服务名，通过负载均衡调用
      timeout-ms: 1500
      backend-service-uri: lb://api-service  # Docker 环境使用服务发现
