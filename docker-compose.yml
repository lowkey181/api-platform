services:
  mysql:
    image: mysql:8.4
    container_name: api-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: api-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: api-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: api-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data

  api-admin:
    build:
      context: ./api-admin
    container_name: api-admin
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
      - nacos
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9002:9002"

  api-service:
    build:
      context: ./api-service
    container_name: api-service
    depends_on:
      - nacos
    ports:
      - "9003:9003"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - nacos
      - api-admin
      - api-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  nacos_data:
